<!DOCTYPE html>
<html>
  <head>
    <title>Kahoot + Thiago Torch Chat</title>
    <meta charset="UTF-8">
    <link rel="icon" type="image/ico+xml" href="https://assets-cdn.kahoot.it/controller/v2/favicon.ico">
    <style>
      :root {
        --website-main-color: #36009E;
      }

      body {
        overflow: clip;
        display: flex;
        margin: 0px;
      }

      .Info {
        position: fixed;
        bottom: 0;
        width: stretch;
        text-align: center;
        padding: 5px;
        background: rgba(255, 255, 255, 0.5);
        color: black;
        margin: 5px;
        border-radius: 15px;
        backdrop-filter: blur(5px);
        box-shadow: 0 0 2px black;
      }

      .Info a {
        color: var(--website-main-color);
      }

      iframe {
        border: none;
        height: 100vh;
      }

      @media (max-width: 1000px) {
        @media (min-height: 1500px) {
          iframe {
            width: 100%;
            height: 45vh;
          }

          body {
            display: flex !important;
            flex-direction: column-reverse;
          }

          .Info {
            font-size: 30px;
            margin: 0px !important;
            position: static !important;
            border-radius: 0px !important;
            place-items: center;
          }

          .PhoneAlert {
            display: flex !important;
          }
        }
      }

      * {
        user-select: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
    </style>
  </head>
  <body>
    <iframe src="https://kahoot.it" height="100vh" width="67%"> </iframe>
    <iframe src="https://thiago0203.github.io/Kahoot/projet.html" height="100vh" width="33%"> </iframe>
    <div class="Info">
      Le site de Kahoot appartient à Kahoot.
      Le chat fonctionne grâce à
      <a href="/">Thiago Torch Chat Lite.</a>
      <div class="PhoneAlert" style="display: none;">
        Pour une meilleure expérience, utiliser une tablette ou un ordinateur.
      </div>
      <a href="mailto:thiagomod.rectified217@passinbox.com">Contact</a>
    </div>
  </body>
</html>
