<!DOCTYPE html>
<html>
  <head>
    <title>Kahoot + ThiagoChat Next</title>
    <meta charset="UTF-8">
    <link rel="icon" type="image/ico+xml" href="https://assets-cdn.kahoot.it/controller/v2/favicon.ico">
    <style>
      :root {
        --website-main-color: #36009E;
      }

      body {
        overflow: clip;
        display: flex;
        margin: 0px;
      }

      .Info {
        position: fixed;
        bottom: 0;
        text-align: center;
        padding: 5px;
        background: rgba(255, 255, 255, 0.5);
        color: black;
        margin: 5px;
        border-radius: 15px;
        backdrop-filter: blur(5px);
        box-shadow: 0 0 2px black;
      }

      .Info a {
        color: var(--website-main-color);
      }

      iframe {
        border: none;
        height: 100vh;
      }

      * {
        user-select: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
    </style>
  </head>
  <body>
    <iframe src="https://kahoot.it" height="100vh" width="67%"> </iframe>
    <iframe src="https://thiagochat.netlify.app/" height="100vh" width="33%"> </iframe>
    <div class="Info">
      Le site de Kahoot, le logo est le nom "Kahoot!" appartient à Kahoot! et sont protégés par des droits d'auteurs.
    </div>
  </body>
</html>
